---
# Aggregates everything that needs human attention:
#   - open Repairs (Settings > System > Repairs), incl. re-auth requests
#   - pending updates
#   - low batteries (numeric < threshold, binary low)
#   - entities unavailable longer than grace period
# Edit tunables below; automations/system/health_report.yaml reviews this entity.
# ponytail: issues() dicts drop fields for non-persistent issues and older cores
# don't filter stale entries - templates read defensively, stale entries self-clean
# when the owning integration recreates/deletes them.
- unique_id: system_health
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: event
      event_type: repairs_issue_registry_updated
    - trigger: state
      entity_id: pyscript.system_health
  variables:
    # Optional, duplicate, or unused entities allowed to be unavailable.
    ignored_unavailable:
      # FRITZ! tracked clients and access controls: offline when devices sleep.
      - device_tracker.epix_3943ce871594
      - device_tracker.hp040e3c879141
      - device_tracker.ipad_2
      - device_tracker.iphone_2
      - device_tracker.living_room_2_2
      - device_tracker.pc_192_168_178_30
      - device_tracker.stephanies_macbook_neo
      - switch.epix_3943ce871594_internet_access
      - switch.hp040e3c879141_internet_access
      - switch.ipad_2_internet_access
      - switch.iphone_internet_access_2
      - switch.living_room_2_internet_access_2
      - switch.pc_192_168_178_30_internet_access
      - switch.stephanies_macbook_neo_internet_access
      # Dishwasher secondary controls; power and operation state stay monitored.
      - binary_sensor.dishwasher_door
      - sensor.dishwasher_duration
      - sensor.dishwasher_program_progress
      - sensor.dishwasher_remaining_program_time
      - switch.dishwasher_program_auto2
      - switch.dishwasher_program_eco50
      - switch.dishwasher_program_intensiv70
      - switch.dishwasher_program_machinecare
      - switch.dishwasher_program_nightwash
      - switch.dishwasher_program_prerinse
      - switch.dishwasher_program_quick65
      - switch.dishwasher_silence_on_demand
      # Unused Hue motion sensor and Hue Bridge automation toggles.
      - binary_sensor.hue_motion_sensor_1_motion
      - sensor.hue_motion_sensor_1_battery
      - sensor.hue_motion_sensor_1_illuminance
      - sensor.hue_motion_sensor_1_temperature
      - switch.hue_motion_sensor_1_light_sensor_enabled
      - switch.hue_motion_sensor_1_motion_sensor_enabled
      - switch.automation_coming_home
      - switch.automation_evening_lights
      - switch.automation_leaving_home
      # Optional iPhone camera/kiosk state.
      - binary_sensor.berties_iphone_camera_motion
      - sensor.berties_iphone_camera_stream
      - sensor.berties_iphone_kiosk_brightness
      - sensor.berties_iphone_kiosk_volume
      # Generated or duplicate integration entities.
      - device_tracker.homekit_bertie_2
      - device_tracker.homekit_housesitter_2
      - device_tracker.homekit_stoof_2
      - media_player.house_party
      - binary_sensor.octopus_energy_a_e94ebeba_octoplus_saving_sessions
      - sensor.octopus_energy_a_e94ebeba_octoplus_points
      - sensor.octopus_energy_electricity_22l3444132_1610012177566_current_accumulative_consumption_cost
      - sensor.octopus_energy_electricity_22l3444132_1610012177566_current_consumption_cost
      - sensor.octopus_energy_gas_e6s16281722261_1603596609_current_consumption_cost
      - sensor.octopus_energy_gas_e6s16281722261_1603596609_previous_accumulative_consumption_m3_cost
    low_battery_percent: 10
    offline_grace_hours: 6
    # Max items listed per category in the notification (rest shown as +N more)
    max_shown: 5
    # Virtual/config domains where "unavailable" is not an actionable signal
    virtual_domains:
      - group
      - scene
      - script
      - automation
      - template
      - counter
      - number
      - select
      - button
      - event
      - calendar
      - todo
      - conversation
      - llm
      - wake_word
      - intent
      - assist_satellite
      - schedule
      - zone
      - update
    health: >-
      {%- set ns = namespace(repairs=[], updates=[], batteries=[], offline=[]) -%}
      {%- for issue in issues().values() | selectattr("dismissed_version", "none") -%}
        {%- if issue.issue_id is match("config_entry_reauth_.*") -%}
          {%- set label = issue.issue_domain if issue.issue_domain is defined and issue.issue_domain else issue.issue_id.split("_")[3] -%}
          {%- set ns.repairs = ns.repairs + ["Re-auth: " ~ label] -%}
        {%- else -%}
          {%- set label = issue.issue_domain if issue.issue_domain is defined and issue.issue_domain else issue.domain -%}
          {%- if issue.translation_key is defined -%}
            {%- set ns.repairs = ns.repairs + [label ~ " " ~ issue.translation_key] -%}
          {%- else -%}
            {%- set ns.repairs = ns.repairs + [label ~ " " ~ issue.issue_id] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for e in states.update | selectattr("state", "eq", "on") -%}
        {%- set ns.updates = ns.updates + [e.attributes.friendly_name] -%}
      {%- endfor -%}
      {%- for e in states.sensor
           | selectattr("attributes.device_class", "defined")
           | selectattr("attributes.device_class", "eq", "battery")
           | rejectattr("state", "in", ["unknown", "unavailable"]) -%}
        {%- if (e.state | float(100)) < low_battery_percent -%}
          {%- set ns.batteries = ns.batteries + [e.attributes.friendly_name ~ " " ~ e.state ~ "%"] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for e in states.binary_sensor
           | selectattr("attributes.device_class", "defined")
           | selectattr("attributes.device_class", "eq", "battery")
           | selectattr("state", "eq", "on") -%}
        {%- set ns.batteries = ns.batteries + [e.attributes.friendly_name ~ " low"] -%}
      {%- endfor -%}
      {%- for e in states
           | selectattr("state", "eq", "unavailable")
           | rejectattr("entity_id", "in", ignored_unavailable) -%}
        {%- if not e.domain in virtual_domains
              and not e.domain is match("input_.*")
              and not is_hidden_entity(e.entity_id)
              and (now() - e.last_changed) > timedelta(hours=offline_grace_hours) -%}
          {%- set ns.offline = ns.offline + [e.attributes.friendly_name] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {"repairs": ns.repairs, "updates": ns.updates, "batteries": ns.batteries, "offline": ns.offline} }}
  binary_sensor:
    - name: "System Health"
      default_entity_id: binary_sensor.system_health
      unique_id: system_health
      device_class: problem
      state: >-
        {{ (health.repairs | count + health.updates | count + health.batteries | count + health.offline | count) > 0 }}
      attributes:
        problems: >-
          {{ health.repairs | count + health.updates | count + health.batteries | count + health.offline | count }}
        summary: >-
          {%- set total = health.repairs | count + health.updates | count + health.batteries | count + health.offline | count -%}
          {%- set ns = namespace(text="") -%}
          {%- if total > 0 -%}
            {%- set ns.text = ns.text ~ total ~ " thing" ~ ("s" if total != 1 else "") ~ " need" ~ ("s" if total != 1 else "") ~ " attention\n" -%}
            {%- if health.repairs -%}
              {%- set ns.text = ns.text ~ "🔧 Repairs: " ~ (health.repairs[:max_shown] | join("; ")) ~ ("" if health.repairs | count <= max_shown else " +" ~ (health.repairs | count - max_shown) ~ " more") ~ "\n" -%}
            {%- endif -%}
            {%- if health.updates -%}
              {%- set ns.text = ns.text ~ "🛵 Updates: " ~ (health.updates[:max_shown] | join("; ")) ~ ("" if health.updates | count <= max_shown else " +" ~ (health.updates | count - max_shown) ~ " more") ~ "\n" -%}
            {%- endif -%}
            {%- if health.batteries -%}
              {%- set ns.text = ns.text ~ "🔋 Batteries: " ~ (health.batteries[:max_shown] | join("; ")) ~ ("" if health.batteries | count <= max_shown else " +" ~ (health.batteries | count - max_shown) ~ " more") ~ "\n" -%}
            {%- endif -%}
            {%- if health.offline -%}
              {%- set ns.text = ns.text ~ "📡 Offline: " ~ (health.offline[:max_shown] | join("; ")) ~ ("" if health.offline | count <= max_shown else " +" ~ (health.offline | count - max_shown) ~ " more") ~ "\n" -%}
            {%- endif -%}
          {%- endif -%}
          {{- ns.text | trim -}}
        # Changes on every recompute: re-arms the alert after an HA restart
        # (the frozen alert integration only reacts to state-change events).
        last_checked: >-
          {{ now().strftime("%H:%M") }}
