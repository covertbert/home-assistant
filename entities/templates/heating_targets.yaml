---
- sensor:
    - name: "Heating Attic Automatic Target"
      unique_id: heating_attic_automatic_target
      device_class: temperature
      unit_of_measurement: "°C"
      availability: >
        {% if is_state('schedule.attic_wfh', 'on') %}
          {% if is_state('input_boolean.home_state', 'on') %}
            {{ state_attr('schedule.attic_wfh', 'temperature') | float(none) is not none }}
          {% else %}
            {{ states('input_number.heating_away') | float(none) is not none }}
          {% endif %}
        {% else %}
          {{ states('input_number.heating_attic_default') | float(none) is not none }}
        {% endif %}
      state: >
        {% if is_state('schedule.attic_wfh', 'on') %}
          {% if is_state('input_boolean.home_state', 'on') %}
            {{ state_attr('schedule.attic_wfh', 'temperature') | float(none) }}
          {% else %}
            {{ states('input_number.heating_away') | float(none) }}
          {% endif %}
        {% else %}
          {{ states('input_number.heating_attic_default') | float(none) }}
        {% endif %}

    - name: "Heating Basement Automatic Target"
      unique_id: heating_basement_automatic_target
      device_class: temperature
      unit_of_measurement: "°C"
      availability: >
        {% if states('sensor.basement_humidity') | float(0) > 70 and is_state('switch.dehumidifier_basement_switch', 'on') %}
          {{ states('input_number.heating_basement_high_humidity') | float(none) is not none }}
        {% else %}
          {{ states('input_number.heating_basement_default') | float(none) is not none }}
        {% endif %}
      state: >
