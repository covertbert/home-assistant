---
# Sends one immediate AI review for new problems, then a daily reminder while
# they remain. The model receives deterministic system-health summary. Review
# persists via system_health.save_review for health dashboard; push is one-line
# headline linking there.
- alias: System Health - AI review
  id: automation_system_health_review
  mode: single
  max_exceeded: silent

  triggers:
    - id: report
      trigger: state
      entity_id: binary_sensor.system_health
      to: "on"
    - id: report
      trigger: time
      at: "09:00:00"
    - id: clear
      trigger: state
      entity_id: binary_sensor.system_health
      to: "off"

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: clear
          sequence:
            - action: notify.mobile_app_berties_iphone
              data:
                message: clear_notification
                data:
                  tag: system-health
        - conditions:
            - condition: state
              entity_id: binary_sensor.system_health
              state: "on"
          sequence:
            - action: ai_task.generate_data
              continue_on_error: true
              response_variable: review
              data:
                entity_id: ai_task.runinfra_health_review
                task_name: system_health_review
                instructions: >-
                  Review this Home Assistant health summary. Use only supplied
                  evidence. State no cause as fact unless summary supports it.
                  Give concise findings, severity and manual next steps. Do not
                  suggest or perform Home Assistant
                  service calls, restarts, power cycles or configuration
                  changes.

                  Output PLAIN TEXT. No markdown of any kind: no asterisks, no
                  # headers, no bullet dashes, no backticks, no bold, no lists.
                  Line 1 must be a single headline under 80 characters naming
                  the main issue and its severity (for example: "Repeated
                  Octopus API errors x5 - medium"). Leave line 2 blank, then
                  the full review, short lines, a blank line between sections,
                  under 150 words:
                  Finding: <what is wrong, one or two lines>
                  Severity: <low / medium / high>
                  Next steps:
                  1 <short manual action>
                  2 <short manual action>

                  {{ state_attr('binary_sensor.system_health', 'summary') }}

            - action: system_health.save_review
              data:
                review: >-
                  {{ review.data if review is defined and review.data is defined and review.data | trim
                     else state_attr('binary_sensor.system_health', 'summary') }}
            - action: notify.mobile_app_berties_iphone
              data:
                title: Home Assistant health review
                message: >-
                  {%- set src = (review.data if review is defined and review.data is defined and review.data | trim else '')
                       or (state_attr('binary_sensor.system_health', 'summary') or '') -%}
                  {{- src.strip().split('\n')[0] or 'Health issue' -}}
                data:
                  tag: system-health
                  url: /dashboard/health-dashboard
