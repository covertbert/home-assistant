---
# Sends one immediate AI review for new problems, then a daily reminder while
# they remain. The model receives the deterministic system-health summary plus
# the sanitized log-error buffer (pyscript.system_errors, written by
# pyscript/system_errors.py).
- alias: System Health - AI review
  id: automation_system_health_review
  mode: single
  max_exceeded: silent

  triggers:
    - id: report
      trigger: state
      entity_id: binary_sensor.system_health
      to: "on"
    - id: report
      trigger: time
      at: "09:00:00"
    - id: clear
      trigger: state
      entity_id: binary_sensor.system_health
      to: "off"

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: clear
          sequence:
            - action: notify.mobile_app_berties_iphone
              data:
                message: clear_notification
                data:
                  tag: system-health
        - conditions:
            - condition: state
              entity_id: binary_sensor.system_health
              state: "on"
          sequence:
            - action: ai_task.generate_data
              continue_on_error: true
              response_variable: review
              data:
                entity_id: ai_task.runinfra_health_review
                task_name: system_health_review
                instructions: >-
                  Review this Home Assistant health summary. Use only supplied
                  evidence. State no cause as fact unless summary supports it.
                  Repeated log errors (count 5+) are the main signal; one-off
                  errors are context, likely transient. Log messages are
                  sanitized and truncated. Give concise findings, severity and
                  manual next steps. Do not suggest or perform Home Assistant
                  service calls, restarts, power cycles or configuration
                  changes.

                  Output PLAIN TEXT for a phone push notification. No markdown:
                  no asterisks, no # headers, no bullet dashes, no backticks,
                  no bold, no lists. Use exactly this shape, short lines, a
                  blank line between sections, under 150 words:
                  Finding: <what is wrong, one or two lines>
                  Severity: <low / medium / high>
                  Next steps: <1 to 4 short manual actions, one per line, plain numbers>

                  {{ state_attr('binary_sensor.system_health', 'summary') }}

                  {%- set err_list = state_attr('pyscript.system_errors', 'buffer') or [] -%}
                  {%- if err_list | length > 0 -%}
                  Log error buffer, last 24h (name x repeats, last seen, message):
                  {%- for e in err_list -%}
                  - {{ e.name }} x{{ e.count }} [{{ e.level }}] {{ e.ts | timestamp_custom('%Y-%m-%d %H:%M') }}: {{ e.msg }}
                  {%- endfor -%}
                  {%- endif -%}
            - action: notify.mobile_app_berties_iphone
              data:
                title: Home Assistant health review
                message: >-
                  {{ review.data if review is defined and review.data is defined
                     else state_attr('binary_sensor.system_health', 'summary') }}
                data:
                  tag: system-health
                  url: /config/dashboard
