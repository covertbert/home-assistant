- alias: Lights - Bedroom - Schedule
  id: automation_areas_bedroom_lights_bedroom_schedule
  mode: single

  triggers:
    # Is the time 1930
    - trigger: time
      at: "19:30:00"

  # Someone is home.
  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.bertie_presence
          state: "on"
        - condition: state
          entity_id: binary_sensor.stoof_presence
          state: "on"
        - condition: state
          entity_id: input_boolean.housesitter_present
          state: "on"

  # Turn on bedroom lights
  action:
    - action: light.turn_on
      target:
        entity_id:
          - light.bedroom
      data:
        color_temp_kelvin: 2600
        brightness_pct: 100
