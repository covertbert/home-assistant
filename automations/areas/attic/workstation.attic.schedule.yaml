- alias: Workstation - Attic - Schedule
  id: automation_areas_attic_workstation_attic_schedule
  mode: single

  triggers:
    # Workstation stays powered through the day and is cut at night.
    - trigger: time
      at: "07:00:00"
      id: day_start
    - trigger: time
      at: "20:00:00"
      id: night_start
    - trigger: homeassistant
      event: start
      id: startup

  action:
    - choose:
        # Between 07:00 and 20:00
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.id == 'day_start'
                   or (trigger.id == 'startup' and 7 <= now().hour < 20) }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.attic_workstation_switch

        # Outside 07:00-20:00
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.id == 'night_start'
                   or (trigger.id == 'startup' and (now().hour >= 20 or now().hour < 7)) }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.attic_workstation_switch
