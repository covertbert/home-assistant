- alias: Heating - Basement - Schedule
  id: automation_areas_basement_heating_basement_schedule
  mode: single

  triggers:
    - trigger: state
      entity_id: sensor.heating_basement_automatic_target
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: climate.basement
      from:
        - unavailable
        - unknown
    - trigger: state
      entity_id: timer.heating_basement_boost
      from: active
      to: idle

  condition:
    - condition: state
      entity_id: timer.heating_basement_boost
      state: idle
    - condition: template
      value_template: "{{ states('sensor.heating_basement_automatic_target') | float(none) is not none }}"
  action:
    - action: climate.turn_on
      target:
        entity_id: climate.basement
    - action: climate.set_temperature
      target:
        entity_id: climate.basement
      data:
        temperature: "{{ states('sensor.heating_basement_automatic_target') | float }}"
