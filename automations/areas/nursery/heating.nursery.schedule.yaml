- alias: Heating - Nursery - Schedule
  id: automation_areas_nursery_heating_nursery_schedule
  mode: restart

  triggers:
    - trigger: state
      entity_id: sensor.heating_nursery_automatic_target
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: climate.nursery
      from:
        - unavailable
        - unknown
    - trigger: state
      entity_id: timer.heating_nursery_boost
      from: active
      to: idle

  condition:
    - condition: state
      entity_id: timer.heating_nursery_boost
      state: idle
    - condition: template
      value_template: "{{ states('sensor.heating_nursery_automatic_target') | float(none) is not none }}"
  action:
    - action: climate.turn_on
      target:
        entity_id: climate.nursery
    - action: climate.set_temperature
      target:
        entity_id: climate.nursery
      data:
        temperature: "{{ states('sensor.heating_nursery_automatic_target') | float }}"
