name: main

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck shell/*.sh

      - name: YAMLLint
        run: pipx run yamllint .

      - name: Prettier
        run: npx -y prettier@3.8.3 --check .

      - name: JS syntax
        run: |
          for f in www/*.js; do
            cp "$f" /tmp/ha-js-check.mjs
            node --check /tmp/ha-js-check.mjs || { echo "JS parse failed: $f"; exit 1; }
          done

      - name: HA config check
        run: ./shell/config_check.sh

  full_deploy:
    name: Full Deploy
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Full Deploy
        shell: bash
        run: |
          curl -X POST "https://homeassistant.mole-anaconda.ts.net/api/webhook/${{ secrets.HA_WEBHOOK_ID }}"
