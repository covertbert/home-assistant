# Fast checks at commit time; docker check (slow) at push time.
pre-commit:
  parallel: true
  commands:
    prettier:
      run: prettier --write .
      stage_fixed: true
    yamllint:
      run: yamllint .
    js:
      run: 'for f in www/*.js; do cp "$f" /tmp/lh-js-check.mjs && node --check /tmp/lh-js-check.mjs || { echo "JS parse failed: $f"; exit 1; }; done'
    shellcheck:
      run: shellcheck shell/*.sh
    deploy:
      run: bash -n shell/deploy.sh && node --check shell/version_lovelace_resources.mjs

    unittest:
      run: python3 shell/test_system_errors_buf.py

pre-push:
  commands:
    config:
      run: ./shell/config_check.sh
